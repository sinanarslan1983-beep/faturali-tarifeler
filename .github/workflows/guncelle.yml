name: Haftalık Tarife Güncelleme
on:
  schedule:
        - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
            - name: Paketleri kur
        run: pip install -r requirements.txt
            - name: Tarifeleri çek
        run: python scraper.py
            - name: Commit ve Push
        run: |
          git config user.name "tarife-bot"
          git config user.email "bot@magazam.local"
          git add tarifeler.json
          git diff --staged --quiet || git commit -m "Otomatik guncelleme"
          git push
