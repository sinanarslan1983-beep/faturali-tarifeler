name: Haftalık Tarife Güncelleme
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Kur
        run: pip install -r requirements.txt
      - name: Çek
        run: python scraper.py
      - name: Kaydet
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add tarifeler.json
          git diff --staged --quiet || git commit -m "guncelle"
          git push
